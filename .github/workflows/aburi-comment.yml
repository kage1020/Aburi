name: Aburi report

on:
  workflow_run:
    workflows: [Aburi]
    types: [completed]

concurrency:
  group: aburi-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  comment:
    name: post the report
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && (github.event.workflow_run.conclusion == 'success'
          || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the upsert script
        uses: actions/checkout@v7
        with:
          sparse-checkout: packages/github-action/scripts
          persist-credentials: false

      - name: Find the report
        id: artifact
        uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner, repo: context.repo.repo, run_id: run.id, per_page: 100,
            })
            const report = artifacts.find((a) => a.name === 'aburi-diff' && !a.expired)
            core.setOutput('found', report ? 'true' : 'false')
            if (report) return
            if (run.conclusion === 'success') {
              core.setFailed(`Run ${run.id} succeeded but uploaded no 'aburi-diff' artifact, so there is no report to post. The upload step in aburi.yml, or the artifact's retention, is the place to look.`)
            } else {
              core.notice(`Run ${run.id} failed before it produced a report; there is nothing to post.`)
            }

      - name: Resolve the pull request
        id: pr
        if: steps.artifact.outputs.found == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run
            const head = `${run.head_repository.owner.login}:${run.head_branch}`
            const open = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', head, per_page: 100,
            })
            const exact = open.find((pr) => pr.head.sha === run.head_sha)
            const chosen = exact ?? (open.length === 1 ? open[0] : undefined)
            core.setOutput('number', chosen ? String(chosen.number) : '')
            if (chosen && !exact) {
              core.setOutput('stale-head', run.head_sha)
              core.warning(`${head} has moved on since run ${run.id}: posting its report for ${run.head_sha} on #${chosen.number}, which the next run replaces.`)
            }
            if (chosen) return
            if (open.length === 0) {
              core.notice(`No open pull request for ${head}; it was closed or merged while the analysis ran.`)
            } else {
              core.setFailed(`${open.length} open pull requests share the head ${head} and none is at ${run.head_sha}, so there is no unambiguous place for this report. Re-run the analysis on the pull request you want it on.`)
            }

      - name: Download the report
        if: steps.pr.outputs.number != ''
        uses: actions/download-artifact@v8
        with:
          name: aburi-diff
          path: report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Decide whether the comment is ours to post
        id: pending
        if: steps.pr.outputs.number != ''
        run: |
          set -euo pipefail
          if [ ! -f report/comment-pending ]; then
            echo "::notice::No comment-pending marker in the artifact: the analysis run reported posting its own comment, so this one has nothing to do."
            echo "post=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f report/diff.md ]; then
            echo "::error::The 'aburi-diff' artifact has a comment-pending marker but no diff.md." >&2
            exit 1
          fi
          echo "post=true" >> "$GITHUB_OUTPUT"

      - name: Say in the report that it is a push behind
        if: steps.pending.outputs.post == 'true' && steps.pr.outputs.stale-head != ''
        env:
          STALE_HEAD: ${{ steps.pr.outputs.stale-head }}
        run: |
          set -euo pipefail
          {
            printf '> ⚠ This report describes commit `%s`, which is no longer the head of this branch. The next analysis run replaces it.\n\n' "$STALE_HEAD"
            cat report/diff.md
          } > report/diff.stale.md
          mv report/diff.stale.md report/diff.md

      - name: Post the report
        if: steps.pending.outputs.post == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          MARKDOWN_PATH: report/diff.md
        run: node packages/github-action/scripts/upsert-comment.mjs
