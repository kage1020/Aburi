name: Docs

on:
  workflow_call:
  workflow_dispatch:

# One site, so not keyed on the ref: a branch dispatch competes with the release for the same deploy.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    if: github.repository == 'kage1020/Aburi'
    runs-on: ubuntu-latest
    steps:
      # Full history: VitePress' lastUpdated reads each page's date from the git log.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the site
        run: pnpm --filter @aburi/docs build

      # The action brings Wrangler; as a workspace dependency it would add ~300 packages to every install.
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          command: deploy
