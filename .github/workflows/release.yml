name: Release

on:
  push:
    branches: [main]

# Serialise release runs — two overlapping merges would race the version bump
# PR / the npm publish. Do NOT cancel in progress; a half-completed publish is
# harder to reason about than a queued one.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: version + publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      # changesets/action opens a PR ("Version Packages") when there are pending
      # changesets. Merging that PR consumes the changesets and re-triggers this
      # workflow, at which point `publish: pnpm release` runs `changeset publish`
      # → `npm publish` for every workspace package whose version bumped since
      # the last tag. --provenance emits a Sigstore attestation from GitHub OIDC
      # so consumers can verify the tarball's build origin.
      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish --no-git-tag
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
