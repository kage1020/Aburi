name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      actionVersion:
        description: "Published @aburi/github-action version to (re)tag, e.g. 0.3.0"
        required: true
        type: string

# Queued, never cancelled: a half-finished publish is harder to recover than a waiting one.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: version + publish
    if: github.event_name == 'push' && github.repository == 'kage1020/Aburi'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # No registry-url: setup-node would write an .npmrc whose _authToken line blocks pnpm's OIDC publish.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Written before changesets/action runs, or it writes an _authToken template that forces token auth.
      - name: Configure .npmrc for Trusted Publishing
        run: |
          {
            echo "registry=https://registry.npmjs.org/"
            echo "provenance=true"
          } > "$HOME/.npmrc"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tag-action:
    name: tag the action release
    needs: release
    if: |
      always() && github.repository == 'kage1020/Aburi' && (
        github.event_name == 'workflow_dispatch' || (
          needs.release.result == 'success' && needs.release.outputs.published == 'true'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the version and commit to tag
        id: target
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ github.event.inputs.actionVersion }}
          PUBLISHED: ${{ needs.release.outputs.publishedPackages }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="$DISPATCH_VERSION"
            package_tag="refs/tags/@aburi/github-action@$version"
            if ! target="$(git rev-list -n 1 "$package_tag" 2>/dev/null)"; then
              echo "::error::No $package_tag in this repository, so $version was never published from it. Check the version." >&2
              exit 1
            fi
          else
            if [ -z "${PUBLISHED:-}" ]; then
              echo "::warning::published=true but publishedPackages is empty; no action tag can be derived. Dispatch this workflow with the version if the action did ship."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            version="$(jq -r '.[] | select(.name == "@aburi/github-action") | .version' <<<"$PUBLISHED")"
            if [ -z "$version" ]; then
              echo "::notice::@aburi/github-action is not in this run's publishedPackages; action tags unchanged."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            target="$(git rev-parse HEAD)"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "::notice::Tagging @aburi/github-action@$version at $target."

      - name: Create the immutable tag and move the major alias
        if: steps.target.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.target.outputs.version }}
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          set -euo pipefail
          immutable="v$VERSION"

          if ! remote_ls="$(git ls-remote --tags origin "refs/tags/$immutable" 2>&1)"; then
            echo "::error::Could not read refs/tags/$immutable from origin, so whether it exists is unknown: $remote_ls" >&2
            exit 1
          fi
          remote_sha="$(printf '%s\n' "$remote_ls" | awk '$2 !~ /\^\{\}$/ {print $1; exit}')"

          if [ -n "$remote_sha" ]; then
            if [ "$remote_sha" = "$TARGET" ]; then
              echo "::notice::$immutable already points at $TARGET; a previous run got this far. Leaving it and moving on to the alias."
            else
              echo "::error::$immutable points at $remote_sha, not at $TARGET. An immutable tag is never re-pointed: if $remote_sha is wrong, delete it deliberately (git push origin :refs/tags/$immutable) and dispatch this workflow again." >&2
              exit 1
            fi
          else
            git tag -f "$immutable" "$TARGET"
            git push origin "refs/tags/$immutable"
            echo "::notice::Created $immutable at $TARGET."
          fi

          case "$VERSION" in
            *-*)
              echo "::notice::$VERSION is a prerelease; the v<major> alias stays where it is."
              exit 0
              ;;
          esac

          alias="v${VERSION%%.*}"
          git tag -f "$alias" "$TARGET"
          git push origin --force "refs/tags/$alias"
          echo "::notice::Moved $alias to $TARGET ($VERSION)."

  docs:
    name: docs
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/docs.yml
    secrets: inherit
