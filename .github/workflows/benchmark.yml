name: Benchmark

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      only:
        description: Comma-separated repo ids from repos.json; empty means every repo
        required: false
        default: ""
      runs:
        description: Measured scan runs per repo; the report quotes the median
        required: false
        default: "3"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  measure:
    name: measure
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run the benchmark
        env:
          ONLY: ${{ inputs.only }}
          RUNS: ${{ inputs.runs || '3' }}
        run: |
          args=(--work-dir "$RUNNER_TEMP/aburi-bench-work" --runs "$RUNS")
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          node benchmarks/public-repos/run.mjs "${args[@]}"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmarks/public-repos/results/
          if-no-files-found: ignore

      - name: Open a pull request with the results
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          report="$(git status --porcelain benchmarks/public-repos/results | awk '$NF ~ /[0-9]\.md$/ { print $NF }' | sort | tail -1)"
          if [ -z "$report" ]; then
            echo "The run produced no new report." >&2
            exit 1
          fi
          stamp="$(basename "$report" .md)"
          branch="benchmark/$stamp"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add benchmarks/public-repos/results
          git commit -m "Record the $stamp public-repository benchmark"
          git push --force origin "$branch"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request for $branch is already open; the push updated it." >&2
            exit 0
          fi
          {
            echo "Measured by the \`Benchmark\` workflow on \`$HEAD_SHA\`."
            echo
            echo "What moved, and whether the runner or the code moved it, is not written yet."
            echo
            cat "$report"
          } > "$RUNNER_TEMP/benchmark-pr-body.md"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Record the $stamp public-repository benchmark" \
            --body-file "$RUNNER_TEMP/benchmark-pr-body.md"
