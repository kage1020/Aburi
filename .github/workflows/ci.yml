name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting `main`. A stacked PR — one whose base is
  # another open branch — otherwise runs no test job at all, so the first time its code is
  # verified is after the branch below it merges and the base flips to `main`.
  pull_request:

# Only cancel superseded runs on PR branches. On `main` we let every push finish
# so the release workflow (which gates on the exact same commands from CI)
# always has a completed CI run to point at, and so branch-protection checks
# do not receive a spurious "neutral / cancelled" that would let a broken build
# slip through to `npm publish`.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Ubuntu is the fast path; macOS + Windows catch path / newline / permission
    # divergence that only shows up on those platforms (canonical JSON write is a
    # frequent offender).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
