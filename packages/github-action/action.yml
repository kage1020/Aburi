name: "Aburi"
description: >-
  Run `aburi diff` on a pull request and upsert the semantic-diff Markdown as a PR comment.
  The CLI is either fetched with `pnpm dlx @aburi/cli@<version>`, so consumers pin the CLI
  version rather than this action, or taken from the project's own install — see the `cli` input.
author: "kage1020"
branding:
  icon: "eye"
  color: "orange"

inputs:
  version:
    description: >-
      npm dist-tag or exact version of `@aburi/cli` to run (e.g. `latest`, `0.1.0`). Passed
      straight to `pnpm dlx`, and ignored under `cli: workspace`, where the project's own
      lockfile decides the version.
    required: false
    default: "latest"
  refspec:
    description: >-
      `<base>..<head>` ref spec forwarded to `aburi diff`, trimmed but otherwise as given. When
      empty, on `pull_request` and `pull_request_target` events, the action reads what is checked
      out. The merge commit a plain `actions/checkout` gives a pull request (its head,
      `github.event.pull_request.head.sha`, as the second parent) is compared with its first
      parent, the base branch commit it was merged into; the head itself is compared with its
      merge base with the base branch (`origin/<github.event.pull_request.base.ref>`, and
      `github.event.pull_request.base.sha`). Any other checkout, a shallow clone, and any other
      event with an empty `refspec`, fail with exit code 2.
    required: false
    default: ""
  fail-on:
    description: >-
      Value passed to `aburi diff --fail-on`, in the CLI's gate grammar (e.g. `changed`,
      `removed:>10`, `dropped-toggled:to-dropped`); see https://aburi.kage1020.com/reference/cli.
      Leave empty to run in report-only mode.
    required: false
    default: ""
  config:
    description: "Path to an `aburi.json` / `aburi.jsonc` (forwarded to `--config`)."
    required: false
    default: ""
  output-dir:
    description: >-
      Where `aburi diff` writes `diff.json` and `diff.md` (forwarded to `--output-dir`): a relative
      value is relative to `working-directory`, an absolute one is used as it is. Must not be empty.
    required: false
    default: "out"
  format:
    description: "`json | md | both`. Must include `md` when `comment: true`; the action verifies this."
    required: false
    default: "both"
  working-directory:
    description: "Directory to run the CLI from (defaults to the repository root)."
    required: false
    default: "."
  cli:
    description: >-
      How the CLI is resolved. `dlx` (default) fetches it with `pnpm dlx @aburi/cli@<version>`:
      no install step, but a plugin named by package (`lang-typescript`) cannot load, because the
      CLI resolves it from the pnpm store rather than from your checkout. `workspace` runs the
      `@aburi/cli` your project installed, resolved from `working-directory`, with its plugins
      beside it; install (and, from source, build) the workspace before this step. `version`,
      `node-version` and `pnpm-version` do not apply to it.
    required: false
    default: "dlx"
  comment:
    description: "Upsert the produced Markdown as a PR comment. Set to `false` to run diff only."
    required: false
    default: "true"
  max-bytes:
    description: >-
      Size cap for `diff.md`, in UTF-8 bytes, forwarded as `--max-bytes`. The report meets it
      least-important-first rather than being cut
      mid-block: sections of whole symbols are cut to names and locations before a section is
      dropped, and the report says at the top which sections are short and which went, pointing
      at `diff.full.md` for the rest. Left empty it is 65507:
      GitHub rejects a comment body over 65536 bytes with a 422, and the hidden marker takes the
      other 29. It applies whether or not this run posts the comment itself, because the artefact
      is what a `workflow_run` companion posts for a fork's pull request. Set to `0` for no cap;
      `diff.json` is unabridged either way.
    required: false
    default: ""
  token:
    description: "GitHub token used to read PR comments and create/update the marker comment."
    required: false
    default: ${{ github.token }}
  node-version:
    description: >-
      Node.js version to install via `actions/setup-node`. Only for `cli: dlx`; under
      `cli: workspace` the action installs nothing and runs on the caller's Node.
    required: false
    default: "24"
  pnpm-version:
    description: >-
      pnpm version to install via `pnpm/action-setup`. Only for `cli: dlx`; under
      `cli: workspace` the action installs nothing and runs on the caller's pnpm.
    required: false
    default: "10"

outputs:
  diff-json-path:
    description: "Absolute path to the JSON diff artefact this run's `aburi diff` wrote (empty when `format=md`, or when the run stopped before writing it). Read it together with `cli-exit-code`: a run that exits 1 or 2 can leave a path to something it could not clear."
    value: ${{ steps.diff.outputs.diff-json-path }}
  diff-md-path:
    description: "Absolute path to the Markdown diff artefact this run's `aburi diff` wrote (empty when `format=json`, or when the run stopped before writing it). Read it together with `cli-exit-code`: a run that exits 1 or 2 can leave a path to something it could not clear."
    value: ${{ steps.diff.outputs.diff-md-path }}
  cli-exit-code:
    description: "Numeric exit code from `aburi diff` (0=clean, 1=runtime error, 2=input error, 3=--fail-on gate or plugin error). Matches `packages/cli/src/exit-codes.ts`. A run that stops before the diff still sets one: 2 for a rejected input, a ref spec that cannot be read from the checkout, or a `cli: workspace` that finds no CLI to run; 1 when a setup step failed. Never empty."
    value: ${{ steps.exit-code.outputs.cli-exit-code }}
  comment-id:
    description: "Numeric id of the PR comment that was created or updated, or empty when `comment=false`."
    value: ${{ steps.post-comment.outputs.comment-id }}
  comment-action:
    description: "`created`, `updated`, `unchanged`, or empty when no comment step ran."
    value: ${{ steps.post-comment.outputs.action }}

runs:
  using: "composite"
  steps:
    - name: "Aburi: validate inputs"
      id: validate
      shell: bash
      env:
        FORMAT: ${{ inputs.format }}
        COMMENT: ${{ inputs.comment }}
        CLI: ${{ inputs.cli }}
        MAX_BYTES: ${{ inputs.max-bytes }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        refuse() {
          echo "cli-exit-code=2" >> "$GITHUB_OUTPUT"
          echo "::error::$1" >&2
          exit 2
        }
        if [ "$COMMENT" = "true" ] && [ "$FORMAT" = "json" ]; then
          refuse "comment=true requires format to include markdown; got format=json."
        fi
        case "$FORMAT" in
          json|md|both) : ;;
          *) refuse "format must be one of: json | md | both (got '$FORMAT')." ;;
        esac
        case "$CLI" in
          dlx|workspace) : ;;
          *) refuse "cli must be one of: dlx | workspace (got '$CLI')." ;;
        esac
        case "$COMMENT" in
          true|false) : ;;
          *) refuse "comment must be true or false (got '$COMMENT')." ;;
        esac
        if [ -n "$MAX_BYTES" ] && ! printf '%s' "$MAX_BYTES" | grep -Eq '^(0|[1-9][0-9]*)$'; then
          refuse "max-bytes must be a non-negative integer, or empty (got '$MAX_BYTES')."
        fi
        if [ -z "$OUTPUT_DIR" ]; then
          refuse "output-dir must not be empty."
        fi

    - name: "Setup pnpm"
      if: inputs.cli == 'dlx'
      uses: "pnpm/action-setup@v6"
      with:
        version: ${{ inputs.pnpm-version }}

    - name: "Setup Node.js"
      if: inputs.cli == 'dlx'
      uses: "actions/setup-node@v7"
      with:
        node-version: ${{ inputs.node-version }}

    # After the toolchain so the resolver uses the pinned Node when there is one, and from
    # `working-directory` because the commit it reads has to be the one the CLI scans as the head.
    - name: "Aburi: resolve refspec"
      id: refspec
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_REFSPEC: ${{ inputs.refspec }}
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: bash "$GITHUB_ACTION_PATH/scripts/refspec-step.sh"

    - name: "Aburi: run diff"
      id: diff
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VERSION: ${{ inputs.version }}
        REFSPEC: ${{ steps.refspec.outputs.value }}
        FORMAT: ${{ inputs.format }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        FAIL_ON: ${{ inputs.fail-on }}
        CONFIG: ${{ inputs.config }}
        CLI: ${{ inputs.cli }}
        MAX_BYTES: ${{ inputs.max-bytes }}
      run: |
        set -euo pipefail
        args=(diff "$REFSPEC" --format "$FORMAT" --output-dir "$OUTPUT_DIR")
        if [ -n "$FAIL_ON" ]; then args+=(--fail-on "$FAIL_ON"); fi
        if [ -n "$CONFIG" ]; then args+=(--config "$CONFIG"); fi

        if [ "$CLI" = "workspace" ]; then
          resolve_error="${RUNNER_TEMP:-/tmp}/aburi-resolve-cli-bin.err"
          set +e
          cli_bin=$(node "$GITHUB_ACTION_PATH/scripts/resolve-cli-bin.mjs" 2>"$resolve_error")
          resolve_status=$?
          set -e
          if [ "$resolve_status" != "0" ]; then
            echo "diff-json-path=" >> "$GITHUB_OUTPUT"
            echo "diff-md-path=" >> "$GITHUB_OUTPUT"
            echo "cli-exit-code=2" >> "$GITHUB_OUTPUT"
            echo "::error::cli=workspace: $(head -n 1 "$resolve_error")" >&2
            exit 2
          fi
          runner=(node "$cli_bin")
        else
          runner=(pnpm dlx "@aburi/cli@$VERSION")
        fi

        set +e
        budget=$(node "$GITHUB_ACTION_PATH/scripts/resolve-max-bytes.mjs" "${runner[@]}")
        budget_status=$?
        set -e
        if [ "$budget_status" != "0" ]; then
          echo "diff-json-path=" >> "$GITHUB_OUTPUT"
          echo "diff-md-path=" >> "$GITHUB_OUTPUT"
          echo "cli-exit-code=2" >> "$GITHUB_OUTPUT"
          exit 2
        fi
        if [ -n "$budget" ]; then args+=(--max-bytes "$budget"); fi

        set +e
        "${runner[@]}" "${args[@]}"
        status=$?
        set -e

        echo "cli-exit-code=$status" >> "$GITHUB_OUTPUT"

        set +e
        paths=$(node "$GITHUB_ACTION_PATH/scripts/report-paths.mjs")
        paths_status=$?
        set -e
        if [ "$paths_status" != "0" ]; then
          printf 'diff-json-path=\ndiff-md-path=\n' >> "$GITHUB_OUTPUT"
          echo "::error::report-paths.mjs failed; no report path was published." >&2
          exit 1
        fi
        printf '%s\n' "$paths" >> "$GITHUB_OUTPUT"

    - name: "Aburi: upsert PR comment"
      id: post-comment
      if: >-
        ${{ inputs.comment == 'true'
            && steps.diff.outputs.diff-md-path != ''
            && (steps.diff.outputs.cli-exit-code == '0'
                || steps.diff.outputs.cli-exit-code == '3') }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        MARKDOWN_PATH: ${{ steps.diff.outputs.diff-md-path }}
        PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      run: node "$GITHUB_ACTION_PATH/scripts/upsert-comment.mjs"

    - name: "Aburi: propagate CLI exit code"
      id: exit-code
      if: always()
      shell: bash
      env:
        DIFF_EXIT: ${{ steps.diff.outputs.cli-exit-code }}
        REFSPEC_EXIT: ${{ steps.refspec.outputs.cli-exit-code }}
        INPUTS_EXIT: ${{ steps.validate.outputs.cli-exit-code }}
      run: bash "$GITHUB_ACTION_PATH/scripts/exit-code-step.sh"
