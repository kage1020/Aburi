packages:
  - "packages/*"
  - "docs"

# esbuild ships a small platform-specific binary that its postinstall script
# extracts. Vitest / tsdown pull esbuild in transitively; approving the build
# here is what turns the pnpm 11 "ignored builds" hard-fail into a normal
# install. If a future dependency adds another native postinstall, add it here
# after auditing the script.
allowBuilds:
  esbuild: true

# Transitive dependencies whose parents already accept the patched release, but
# whose resolved version predates a published advisory. Each entry stays inside
# the parent's declared range, so it lifts the floor without forcing a major.
# Drop an entry once every parent resolves to the patched version on its own.
overrides:
  fast-uri@3: "^3.1.6"
  js-yaml@3: "^3.15.2"
  js-yaml@4: "^4.3.2"
  nanoid@3: "^3.3.18"
  postcss: "^8.5.23"
